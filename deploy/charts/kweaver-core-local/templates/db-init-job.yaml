{{- if .Values.dbInit.enabled }}
{{- $rds := .Values.global.depServices.rds }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-init
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.dbInit.backoffLimit | default 3 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-db-init
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      containers:
        - name: db-init-placeholder
          image: "{{ .Values.dbInit.image.repository }}:{{ .Values.dbInit.image.tag }}"
          imagePullPolicy: {{ .Values.dbInit.image.pullPolicy | default "IfNotPresent" }}
          command: ["sh", "-c"]
          args:
            - |
              echo "db-init placeholder job";
              echo "target=core-local";
              echo "db_host={{ $rds.host }}";
              echo "db_port={{ $rds.port }}";
              echo "db_user={{ $rds.user }}";
              exit 0
{{- end }}
