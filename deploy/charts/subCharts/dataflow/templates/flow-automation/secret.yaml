{{- $depServices := include "mergedGlobalValues.depServices" . | fromYaml -}}
{{- if .Values.components.flowAutomation.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dataflow.flowAutomation.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dataflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "dataflow.flowAutomation.fullname" . }}
data:
  MONGODB_PASSWORD: {{ $depServices.mongodb.password | toString | b64enc | quote }}
  REDIS_USERNAME: {{ $depServices.redis.connectInfo.username | b64enc | quote }}
  REDIS_PASSWORD: {{ $depServices.redis.connectInfo.password | toString | b64enc | quote }}
  REDIS_SENTINEL_USERNAME:  {{ $depServices.redis.connectInfo.sentinelUsername | b64enc | quote }}
  REDIS_SENTINEL_PASSWORD:  {{ $depServices.redis.connectInfo.sentinelPassword| toString | b64enc | quote }}
  DB_PASSWORD: {{ $depServices.rds.password | toString | b64enc | quote }}
  {{- if and $depServices.mq.auth (not (eq (printf "%s" $depServices.mq.auth) "{}")) }}
  MQ_AUTH_USERNAME: {{ $depServices.mq.auth.username | toString | b64enc | quote }}
  MQ_AUTH_PASSWORD: {{ $depServices.mq.auth.password | toString | b64enc | quote }}
  MQ_AUTH_MECHANISM: {{ $depServices.mq.auth.mechanism | toString | b64enc | quote }}
  {{- end }}
{{- end }}
