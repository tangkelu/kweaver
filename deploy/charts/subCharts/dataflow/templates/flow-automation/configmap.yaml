{{- $depServices := include "mergedGlobalValues.depServices" . | fromYaml -}}
{{- $env := include "mergedGlobalValues.env" . | fromYaml -}}
{{- $accessAddress := include "mergedGlobalValues.accessAddress" . | fromYaml -}}
{{- $flowAutomation := include "mergedGlobalValues.flowAutomation" . | fromYaml -}}
{{- $flowO11yDataLog := index $flowAutomation "flow-o11y-data-log" | default dict -}}
{{- $flowO11yExporters := index $flowO11yDataLog "exporters" | default dict -}}
{{- $protonMq := index $flowO11yExporters "proton_mq" | default dict -}}
{{- $protonMqConfig := index $protonMq "config" | default dict -}}
{{- $renderFlowO11yExporters := deepCopy $flowO11yExporters -}}
{{- if and (ne (default "" $depServices.mq.mqHost) "") (gt (int (default 0 $depServices.mq.mqPort)) 0) -}}
{{- $_ := set $renderFlowO11yExporters "proton_mq" (mergeOverwrite (deepCopy $protonMq) (dict "config" (mergeOverwrite (deepCopy $protonMqConfig) (dict "broker_list" (list (printf "%s:%v" $depServices.mq.mqHost $depServices.mq.mqPort)))))) -}}
{{- end -}}
{{- if .Values.components.flowAutomation.enabled }}
