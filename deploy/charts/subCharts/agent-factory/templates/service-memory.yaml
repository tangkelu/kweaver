# Agent Memory Service (内部服务)
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.moduleName }}-memory
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.moduleName }}
    service: agent-memory
spec:
  ports:
    - name: memory-port
      protocol: TCP
      port: {{ .Values.agentMemory.port }}
      targetPort: {{ .Values.agentMemory.port }}
  selector:
    app: {{ .Values.moduleName }}
  type: ClusterIP
