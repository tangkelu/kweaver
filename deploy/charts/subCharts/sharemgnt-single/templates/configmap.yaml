{{- $env := include "mergedGlobalValues.env" . | fromYaml -}}
{{- $depServices := include "mergedGlobalValues.depServices" . | fromYaml -}}
{{- $accessAddress := include "mergedGlobalValues.accessAddress" . | fromYaml -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-conf
  namespace: {{ .Release.Namespace }}
data:
  SYSTEM_ID: {{ $depServices.rds.system_id | quote }}

  {{- with $depServices.redis }}
  REDIS_CONNECTTYPE: {{ .connectType | quote }}
  REDIS_SSL: {{ .enableSSL | quote }}
  REDIS_SECRETNAME: {{ .secretName | quote }}
  REDIS_CANAME: {{ .caName | quote }}
  REDIS_CERTNAME: {{ .certName | quote }}
  REDIS_KEYNAME: {{ .keyName | quote }}

  {{- if eq .connectType "sentinel"}}
  REDIS_HOST: {{ .connectInfo.sentinelHost | quote }}
  REDIS_PORT: {{ .connectInfo.sentinelPort | quote }}
  REDIS_MASTER_NAME: {{ .connectInfo.masterGroupName | quote }}
  {{- end}}

  {{- if eq .connectType "master-slave"}}
  REDIS_HOST: {{ .connectInfo.masterHost | quote }}
  REDIS_PORT: {{ .connectInfo.masterPort | quote }}
  REDIS_SLAVE_HOST: {{ .connectInfo.slaveHost | quote }}
  REDIS_SLAVE_PORT: {{ .connectInfo.slavePort | quote }}
  {{- end}}

  {{- if eq .connectType "standalone"}}
  REDIS_HOST: {{ .connectInfo.host | quote }}
  REDIS_PORT: {{ .connectInfo.port | quote }}
  {{- end}}

  {{- if eq .connectType "cluster"}}
  REDIS_HOST: {{ .connectInfo.host | quote }}
  REDIS_PORT: {{ .connectInfo.port | quote }}
  {{- end}}

  {{- end }}

  service_access.conf: |
    [log]
    host = {{ $depServices.log.host }}
    port = {{ $depServices.log.port }}

    [ossgateway]
    protocol = {{ index $depServices "ossgatewaymanager" "protocol" }}
    privateHost = {{ index $depServices "ossgatewaymanager" "privateHost" }}
    privatePort = {{ index $depServices "ossgatewaymanager" "privatePort" }}

    [authentication]
    privateHost = {{ index $depServices "authentication" "privateHost" }}
    privatePort = {{ index $depServices "authentication" "privatePort" }}

  cluster.conf: |
    [cluster]
{{- if contains "," $depServices.rds.host }}
    db_host = DM
{{- else}}
    db_host = {{ $depServices.rds.host }}
{{- end}}
    db_port = {{ $depServices.rds.port }}
    use_external_db = True

  app_default.conf: |
    [Global]
    use_rds = False
    use_iaas = False
    business_time_offset = {{ .Values.service.businessTimeOffset }}

    [ShareMgnt]
    port = {{ .Values.service.port }}
    check_service_node = True

    # 单副本chart
    is_single = True

  language.conf: |
    LANG={{ .Values.service.language }}

  sigusr1.conf: |
    [output]
    # 结果输出的根目录设置
    root = /sysvol/log

    [dumpstacks]
    # 获取python进程的当前所有线程堆栈
    # 结果输出到文件 $root/dumpstacks/dumpstacks_PID_TIME.log
    enable = True

    [dumpmemory]
    # 获取python进程的当前内存占用情况
    # 结果输出到文件 $root/dumpmemory/dumpmemory_PID_TIME.log
    enable = False

  dm_svc.conf: |
    TIME_ZON=(480)
    LANGUAGE=(cn)
    DM={{ printf "(%s)" $depServices.rds.host }}
    [DM]
    LOGIN_MODE=(1)

  mq_config.yaml: |
    {{- toYaml $depServices.mq | nindent 4 }}
