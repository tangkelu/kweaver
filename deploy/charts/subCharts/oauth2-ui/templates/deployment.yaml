{{- $env := include "mergedGlobalValues.env" . | fromYaml -}}
{{- $depServices := include "mergedGlobalValues.depServices" . | fromYaml -}}
{{- if semverCompare ">=1.16-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: apps/v1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  replicas: {{ include "mergedGlobalValues.replicaCount" . }}
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/configmap: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app: {{ .Chart.Name }}
    spec:
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - {{ .Chart.Name }}
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "mergedGlobalValues.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
          env:
            {{- if .Values.service.logger }}
              - name: LOGOUT
                value: {{ .Values.service.logger }}
            {{- end }}
            {{- if $env.language }}
              - name: LANG
                value: {{ $env.language }}
              - name: LC_ALL
                value: {{ $env.language }}
            {{- end }}
            {{- if $env.timezone }}
              - name: TZ
                value: {{ $env.timezone }}
            {{- end }}
            {{- if $depServices.hydra.publicHost }}
              - name: HYDRA_PUBLIC_API_BASE
                value: "{{ $depServices.hydra.publicProtocol }}://{{ $depServices.hydra.publicHost }}:{{ $depServices.hydra.publicPort }}"
            {{- end }}
            {{- if $depServices.hydra.administrativeHost }}
              - name: HYDRA_PRIVATE_API_BASE
                value: "{{ $depServices.hydra.administrativeProtocol }}://{{ $depServices.hydra.administrativeHost }}:{{ $depServices.hydra.administrativePort }}{{ $depServices.hydra.administrativePrefix }}"
            {{- end }}
            {{- if $depServices.hydra.administrativePrefix }}
              - name: HYDRA_PRIVATE_API_BASE_PREFIX
                value: "{{ $depServices.hydra.administrativePrefix }}"
            {{- end }}
            {{- if $depServices.hydra.thirdLoginRemember }}
              - name: IS_THIRD_REMEMBER_LOGIN
                value: "{{ $depServices.hydra.thirdLoginRemember }}"
            {{- end }}
            {{- if $depServices.eacp.publicHttpHost }}
              - name: EACP_PUBLIC_API_BASE
                value: "{{ $depServices.eacp.publicHttpProtocol}}://{{ $depServices.eacp.publicHttpHost }}:{{ $depServices.eacp.publicHttpPort }}"
            {{- end }}
            {{- if $depServices.eacp.privateHttpHost }}
              - name: EACP_PRIVATE_API_BASE
                value: "{{ $depServices.eacp.privateHttpProtocol}}://{{ $depServices.eacp.privateHttpHost }}:{{ $depServices.eacp.privateHttpPort }}"
            {{- end }}
            {{- if $depServices.authentication.publicHost }}
              - name: AUTHENTICATION_PUBLIC_API_BASE
                value: "{{ $depServices.authentication.publicProtocol }}://{{ $depServices.authentication.publicHost }}:{{ $depServices.authentication.publicPort }}"
            {{- end }}
            {{- if $depServices.authentication.privateHost }}
              - name: AUTHENTICATION_PRIVATE_API_BASE
                value: "{{ $depServices.authentication.privateProtocol }}://{{ $depServices.authentication.privateHost }}:{{ $depServices.authentication.privatePort }}"
            {{- end }}
            {{- if index $depServices "deploy-web" "serviceHost" }}
              - name: DEPLOY_WEB_SERVICE_API_BASE
                value: {{ index $depServices "deploy-web" "serviceProtocol"}}://{{ index $depServices "deploy-web" "serviceHost"}}:{{ index $depServices "deploy-web" "servicePort"}}
            {{- end }}
            {{- if index $depServices "user-management" "privateHost" }}
              - name: USER_MANAGEMENT_PRIVATE_API_BASE
                value: {{ index $depServices "user-management" "privateProtocol"}}://{{ index $depServices "user-management" "privateHost"}}:{{ index $depServices "user-management" "privatePort"}}
            {{- end }}
              - name: DEPLOY_WEB_SERVICE
                value: {{ index $depServices "deploy-web-service" "privateProtocol"}}://{{ index $depServices "deploy-web-service" "privateHost"}}:{{ index $depServices "deploy-web-service" "privatePort"}}
            {{- if index $depServices "eacp" "eacpApiTimeout" }}
              - name: EACP_API_TIMEOUT
                value: "{{ $depServices.eacp.eacpApiTimeout }}"
            {{- end }}
          ports:
            - name: svc-port
              containerPort: 4015
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: svc-port
            initialDelaySeconds: {{ .Values.service.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.service.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.service.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.service.readinessProbe.failureThreshold }}
          volumeMounts:
            - name:  oauth2-ui-conf
              mountPath: /opt/oauth2/conf
            - name:  npm-cache
              mountPath: /.npm
          livenessProbe:
            tcpSocket:
              port: svc-port
            initialDelaySeconds: {{ .Values.service.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.service.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.service.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.service.livenessProbe.failureThreshold }}
        {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      volumes:
        - name: oauth2-ui-conf
          configMap:
            name: oauth2-ui-conf
        - name: npm-cache
          emptyDir: {}
      dnsConfig:
        options:
          - name: single-request-reopen
          - name: use-vc
