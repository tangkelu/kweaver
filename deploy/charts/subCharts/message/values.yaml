replicaCount: 1
nodeSelector: {}
namespace: message
image:
  registry: ""
  service:
    repository: as/message
    tag: "0.3.0-07ddb2d-20260206.1"
    pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 30935
  language: zh_CN
  logger: stdout
  sslOn: false
  certFile: /sysvol/conf/message.crt
  keyFile: /sysvol/conf/message.key
  businessTimeOffset: 0
  todoMsgCleanTime: 90
  notificationCleanTime: 90
  invalidMsgCleanTime: "1:30:00"
  logLevel: 4
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  enableDualStack: false
env:
  language: en_US.UTF-8
  timezone: Asia/Shanghai
depServices:
  rds:
    host: 127.0.0.1
    port: 3320
    user: ""
    password: ""
    database: anyshare
    maxConnections: 30
    dbCharset: utf8mb4
    timeout: 10
    readTimeout: 10
    writeTimeout: 10
    type: mysql
    system_id: ""
  hydra:
    publicHost: hydra-public
    publicPort: 4444
    administrativeHost: hydra-admin
    administrativePort: 4445
  mq: {}
  user-management:
    privateHost: user-management-private
    privatePort: 30980
securityContext:
  runAsUser: 5000
  runAsGroup: 5000
resources:
  requests:
    cpu: 10m
    memory: 100Mi
  limits:
    cpu: 4
    memory: 4Gi
