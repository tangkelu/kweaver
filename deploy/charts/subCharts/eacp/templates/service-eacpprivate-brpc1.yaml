apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-private-brpc1
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
{{- if .Values.service.enableDualStack }}
  ipFamilies:
  - IPv6
  - IPv4
  ipFamilyPolicy: PreferDualStack
{{- end }}
  ports:
    - name: eacpprivate-brpc1
      port: {{ .Values.service.port }}
      protocol: TCP
      targetPort: {{add 3 .Values.service.port }}
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{add 3 .Values.service.port }}
      {{- end}}
  selector:
    app: {{ .Chart.Name }}
  type: {{ .Values.service.type }}
