{{- if .Values.dbInit.enabled }}
{{- $rds := .Values.global.depServices.rds }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-init
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.dbInit.backoffLimit | default 3 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-db-init
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/busybox:1.37.0"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              echo "Simulated db-init hook for umbrella install test"
              echo "DB_HOST=${DB_HOST}"
              echo "DB_PORT=${DB_PORT}"
              echo "DB_USER=${DB_USER}"
              echo "DB_NAME=${DB_NAME}"
              echo "DB_TYPE=${DB_TYPE}"
              echo "MIGRATION_TARGET=${MIGRATION_TARGET}"
              sleep 2
              echo "db-init simulation finished"
          env:
            - name: DB_HOST
              value: {{ $rds.host | quote }}
            - name: DB_PORT
              value: {{ $rds.port | quote }}
            - name: DB_USER
              value: {{ $rds.user | quote }}
            - name: DB_PASSWORD
              value: {{ $rds.password | quote }}
            - name: DB_NAME
              value: {{ $rds.database | default "adp" | quote }}
            - name: DB_TYPE
              value: {{ $rds.type | default "MariaDB" | quote }}
            - name: MIGRATION_TARGET
              value: "core"
{{- end }}
